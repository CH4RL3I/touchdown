[project]
name = "landsim"
version = "0.1.0"
description = "Vision-based drone landing perception, pose estimation and guidance, evaluated against ground truth in simulation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emilio Gappa" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.scripts]
landsim = "landsim.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landsim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
